# Hermes IBC Relayer - Reference Configuration
# cumulo.me | June 2026 | Hermes v1.13.2
#
# Active paths:
#   - mocha-4          <-> provider          (testnet)
#   - celestia         <-> cosmoshub-4       (mainnet - own channel)
#   - celestia         <-> xrplevm_1440000-1 (mainnet - own channel)
#   - celestia         <-> injective-1       (mainnet - relayer on existing channel)
#   - cosmoshub-4      <-> xrplevm_1440000-1 (mainnet - relayer on Peersyst channel)
#   - cosmoshub-4      <-> injective-1       (mainnet - relayer on existing channel)
#   - xrplevm_1440000-1 <-> injective-1      (mainnet - relayer on existing channel)
#   - cosmoshub-4      <-> seda-1            (mainnet - relayer on existing channel)
#   - celestia/cosmoshub/xrplevm/injective/seda <-> osmosis-1 (mainnet - relayer on existing channels)

[global]
log_level = "info"

[mode.clients]
enabled      = true
refresh      = true
misbehaviour = true

[mode.connections]
enabled = false

[mode.channels]
enabled = false

[mode.packets]
enabled         = true
clear_interval  = 100
clear_on_start  = true
tx_confirmation = true

[rest]
enabled = false
host    = "127.0.0.1"
port    = 3000

[telemetry]
enabled = true
host    = "127.0.0.1"
port    = 3001

[[chains]]
id             = "mocha-4"
type           = "CosmosSdk"
rpc_addr       = "https://mocha.celestia.rpc.cumulo.me"
grpc_addr      = "https://mocha.grpc.cumulo.me"
event_source   = { mode = "push", url = "wss://mocha.celestia.rpc.cumulo.me/websocket" }
rpc_timeout    = "10s"
trusted_node   = false
account_prefix = "celestia"
key_name       = "relayer-mocha"
key_store_type = "Test"
store_prefix   = "ibc"
default_gas    = 300000
max_gas        = 600000
gas_multiplier = 1.5
max_msg_num    = 30
max_tx_size    = 180000
clock_drift    = "5s"
max_block_time = "30s"
trusting_period = "7days"
compat_mode    = "0.37"

[chains.gas_price]
price = 0.1
denom = "utia"

[chains.address_type]
derivation = "cosmos"

